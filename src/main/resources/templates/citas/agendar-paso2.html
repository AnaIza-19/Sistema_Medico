<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Agendar Cita - Paso 2</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
        }

        .contenedor {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .progreso {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .paso {
            width: 18%;
            text-align: center;
            padding: 10px 5px;
            background-color: #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
        }

        .paso.activo {
            background-color: #1976d2;
            color: white;
            font-weight: bold;
        }

        .campo {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .mensaje-error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .modo-recepcion {
            background-color: #e7f3ff;
            color: #0c5460;
            border: 1px solid #b6d4fe;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .botones {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .btn {
            padding: 11px 22px;
            border-radius: 5px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-volver {
            background-color: #e0e0e0;
            color: #333;
        }

        .btn-continuar {
            background-color: #1976d2;
            color: white;
        }

    </style>

</head>


<body>


<div class="contenedor">

    <h1>
        Agendar Cita Médica
    </h1>


    <!-- ===================================== -->
    <!-- MODO RECEPCIÓN / WALK-IN -->
    <!-- ===================================== -->

    <div
            class="modo-recepcion"
            th:if="${origen == 'recepcion'}"
    >
        Agendamiento desde Recepción
    </div>


    <!-- ===================================== -->
    <!-- INDICADOR DE PROGRESO -->
    <!-- ===================================== -->

    <div class="progreso">

        <div class="paso">
            1. Sucursal
        </div>

        <div class="paso activo">
            2. Especialidad
        </div>

        <div class="paso">
            3. Médico
        </div>

        <div class="paso">
            4. Fecha/Hora
        </div>

        <div class="paso">
            5. Confirmar
        </div>

    </div>


    <!-- ===================================== -->
    <!-- MENSAJE FA01 -->
    <!-- ===================================== -->

    <div
            class="mensaje-error"
            th:if="${mensajeError}"
            th:text="${mensajeError}"
    >
    </div>


    <!-- ===================================== -->
    <!-- PASO 2 -->
    <!-- ===================================== -->

    <form
            method="get"
            th:action="@{/citas/agendar/medico}"
            th:if="${!especialidades.isEmpty()}"
    >

        <!-- SUCURSAL -->

        <input
                type="hidden"
                name="sucursalId"
                th:value="${sucursalId}"
        >


        <!-- PACIENTE WALK-IN -->

        <input
                type="hidden"
                name="pacienteId"
                th:value="${pacienteId}"
                th:if="${pacienteId != null}"
        >


        <!-- ORIGEN -->

        <input
                type="hidden"
                name="origen"
                th:value="${origen}"
                th:if="${origen != null}"
        >


        <div class="campo">

            <label for="especialidadId">
                Seleccione una especialidad:
            </label>


            <select
                    id="especialidadId"
                    name="especialidadId"
                    required
            >

                <option value="">
                    -- Seleccione una especialidad --
                </option>


                <option
                        th:each="especialidad : ${especialidades}"
                        th:value="${especialidad.id}"
                        th:text="${especialidad.nombre}"
                >
                </option>

            </select>

        </div>


        <div class="botones">


            <!-- ===================================== -->
            <!-- VOLVER - WALK-IN -->
            <!-- ===================================== -->

            <a
                    th:if="${origen == 'recepcion'}"
                    th:href="@{/citas/agendar(
                        pacienteId=${pacienteId},
                        origen='recepcion'
                    )}"
                    class="btn btn-volver"
            >

                Volver

            </a>


            <!-- ===================================== -->
            <!-- VOLVER - PACIENTE NORMAL -->
            <!-- ===================================== -->

            <a
                    th:unless="${origen == 'recepcion'}"
                    th:href="@{/citas/agendar}"
                    class="btn btn-volver"
            >

                Volver

            </a>


            <button
                    type="submit"
                    class="btn btn-continuar"
            >

                Continuar

            </button>

        </div>

    </form>


    <!-- ===================================== -->
    <!-- SI NO HAY ESPECIALIDADES -->
    <!-- ===================================== -->

    <div
            class="botones"
            th:if="${especialidades.isEmpty()}"
    >


        <!-- WALK-IN -->

        <a
                th:if="${origen == 'recepcion'}"
                th:href="@{/citas/agendar(
                    pacienteId=${pacienteId},
                    origen='recepcion'
                )}"
                class="btn btn-volver"
        >

            Volver a seleccionar sucursal

        </a>


        <!-- PACIENTE NORMAL -->

        <a
                th:unless="${origen == 'recepcion'}"
                th:href="@{/citas/agendar}"
                class="btn btn-volver"
        >

            Volver a seleccionar sucursal

        </a>

    </div>


</div>


</body>

</html>
