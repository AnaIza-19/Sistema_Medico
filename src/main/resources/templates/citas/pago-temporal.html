<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pago de Cita</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
        }

        .contenedor {
            width: 90%;
            max-width: 700px;
            margin: 60px auto;
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.12);
            text-align: center;
        }

        .mensaje-exito {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 7px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .nota {
            color: #555;
            margin-top: 20px;
        }

    </style>

</head>

<body>

<div class="contenedor">

    <h1>Proceso de Pago</h1>

    <div
            class="mensaje-exito"
            th:if="${mensajeExito}"
            th:text="${mensajeExito}">
    </div>

    <p>
        La cita quedó registrada con estado
        <strong>Pendiente de pago</strong>.
    </p>

    <p class="nota">
        El proceso de pago y el temporizador de 5 minutos
        se implementarán en el CU-04.
    </p>

</div>

</body>

</html>
