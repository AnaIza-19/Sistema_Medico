<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .contenedor {
            background-color: white;
            width: 360px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            background-color: #1976d2;
            color: white;
            cursor: pointer;
        }

        .error {
            color: red;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
        }

        .regresar {
            display: block;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>Panel Administrativo</h1>

    <form method="post"
          th:action="@{/admin/login}">

        <label for="usuario">
            Usuario
        </label>

        <input
                type="text"
                id="usuario"
                name="usuario"
                required>

        <label for="contrasena">
            Contraseña
        </label>

        <input
                type="password"
                id="contrasena"
                name="contrasena"
                required>

        <button type="submit">
            Iniciar Sesión
        </button>

    </form>

    <p
            class="error"
            th:if="${error}"
            th:text="${error}">
    </p>

    <a href="/"
       class="regresar">
        Regresar al portal
    </a>

</div>

</body>
</html>
