<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Crear rol | CU-14</title><link rel="stylesheet" th:href="@{/css/cu14-roles.css}" href="/css/cu14-roles.css"></head>
<body><main class="contenedor form-contenedor">
    <h1>Crear Rol</h1><p>Administrador: <strong th:text="${adminName}">admin1</strong></p>
    <div class="alerta error" th:if="${mensajeError}" th:text="${mensajeError}"></div>
    <form method="post" th:action="@{/admin/roles/crear}">
        <div class="campo"><label for="nombre">Nombre del rol *</label>
            <input id="nombre" name="nombre" required maxlength="30" minlength="3" pattern="[A-Za-z][A-Za-z0-9_]{2,29}" placeholder="PRUEBA_CU14">
            <small>De 3 a 30 caracteres, letras, números y guion bajo. Se guardará en mayúsculas.</small>
        </div>
        <div class="campo"><label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="descripcion" maxlength="255" placeholder="Descripción del rol"></textarea></div>
        <div class="acciones"><button class="btn" type="submit">Guardar rol</button><a class="btn btn-gris" th:href="@{/admin/roles}">Cancelar / Volver</a></div>
    </form>
    <p class="nota">Los roles personalizados se crean sin permisos. Puedes asignarlos desde el listado después de guardar.</p>
</main></body></html>
