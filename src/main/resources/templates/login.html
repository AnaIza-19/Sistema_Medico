<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .exito {
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }

        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            width: 350px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        input:disabled {
            background-color: #e9ecef;
            cursor: not-allowed;
        }

        .error {
            color: red;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .bloqueado {
            color: #b00020;
            background-color: #ffe5e5;
            border: 1px solid #ffb3b3;
            padding: 10px;
            margin-top: 15px;
            border-radius: 5px;
            text-align: center;
        }

        .enlaces {
            text-align: center;
            margin-top: 20px;
        }

        .enlaces a {
            display: block;
            margin-top: 10px;
        }
    </style>

</head>

<body>

<div class="login-container">

    <h1>Iniciar Sesión</h1>

    <!-- MENSAJE DE REGISTRO EXITOSO -->
    <div
            class="exito"
            th:if="${registroExitoso}"
            th:text="${registroExitoso}">
    </div>

    <form action="/login-paciente" method="post">

        <label for="usuario">
            Usuario:
        </label>

        <input
                id="usuario"
                type="text"
                name="usuario"
                required
                th:disabled="${bloqueado}">

        <label for="contrasena">
            Contraseña:
        </label>

        <input
                id="contrasena"
                type="password"
                name="contrasena"
                required
                th:disabled="${bloqueado}">

        <button
                type="submit"
                th:disabled="${bloqueado}">
            Iniciar Sesión
        </button>

    </form>

    <!-- Mensaje de error -->
    <p
            class="error"
            th:if="${error}"
            th:text="${error}">
    </p>

    <!-- Mensaje cuando la cuenta está bloqueada -->
    <div
            class="bloqueado"
            th:if="${bloqueado}">
        Los campos de inicio de sesión permanecerán deshabilitados mientras la cuenta esté bloqueada.
    </div>

    <div class="enlaces">

        <a href="/">
            Regresar al portal
        </a>

        <!-- Requisito FA09 -->
        <a
                href="/panel-administrativo"
                th:if="${usuarioInterno}">
            Acceso Panel Administrativo
        </a>

    </div>

</div>

</body>

</html>
